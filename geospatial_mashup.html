<!DOCTYPE html>
<html>

<head>
    <title>Geospatial Mashup</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            width: 100%;
            height: 600px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        // --- Inisialisasi Peta ---
        var mymap = L.map('map').setView([34.5095256, 135.5867008], 14);
        // --- Basemap OpenStreetMap ---
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                'OpenStreetMap</a> contributors'
        }).addTo(mymap);
        // --- Marker (Objek Titik) ---
        var marker = L.marker([34.5095256, 135.5867008]).addTo(mymap);
        marker.bindPopup('<b>PL Hospital</b><br>Rumah sakit swasta yang dikelola oleh organisasi keagamaan');
        // --- Circle (Objek Lingkaran) ---
        var circle = L.circle([34.5095256, 135.5867008], {
            color: '#FF1493', fillColor: '#FFC0CB',
            fillOpacity: 0.5, radius: 1000
        }).addTo(mymap);
        circle.bindPopup('Radius 1000 m dari titik ini.');
        // --- Polygon (Objek Area) ---
        var polygon = L.polygon([
            [34.5188663, 135.5584958],
            [34.5140136, 135.4986743],
            [34.4325797, 135.5820945],
        ], { color: '#2E8B58', fillColor: '#00FF7F', fillOpacity: 0.3 })
            .addTo(mymap);
        polygon.bindPopup('Area Kawasan A');
        // --- Polyline (Objek Garis) ---
        var polyline = L.polyline([
            [34.442192, 135.2478721], [34.440686, 135.2599443],
            [34.426335, 135.2759061], [34.414416, 135.2923481]
        ], { color: '#FF0000', weight: 3, opacity: 0.8 })
            .addTo(mymap);
        polyline.bindPopup('Jalur A');
    </script>
</body>

</html>
